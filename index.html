<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PULSE | Advanced Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        :root { --primary: #3b82f6; --sidebar: #0f172a; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text-dark: #1e293b; --accent: #8b5cf6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        aside { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; padding: 2rem 1rem; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 3rem; padding-left: 1rem; }
        .nav-btn { display: flex; align-items: center; gap: 15px; padding: 16px; color: #94a3b8; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-size: 1.1rem; transition: 0.2s; }
        .nav-btn.active { background: rgba(59, 130, 246, 0.1); color: white; box-shadow: inset 4px 0 0 var(--primary); }

        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .view { padding: 2.5rem; display: none; max-width: 1100px; margin: 0 auto; width: 100%; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 16px; border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        
        input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f9fafb; margin-top: 8px; outline: none; font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-backup { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #64748b; font-size: 0.8rem; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }

        /* Chart Simulation */
        .bar-container { display: flex; align-items: flex-end; gap: 15px; height: 150px; padding: 10px; border-bottom: 2px solid var(--border); }
        .bar { background: var(--primary); width: 40px; transition: height 0.5s ease; border-radius: 4px 4px 0 0; position: relative; }
        .bar::after { content: attr(data-label); position: absolute; bottom: -25px; left: 0; font-size: 10px; width: 100%; text-align: center; color: #64748b; }
    </style>
</head>
<body>

    <aside>
        <div class="logo"><i data-lucide="activity"></i> THE PULSE</div>
        <button class="nav-btn active" onclick="show('v-dash', this)"><i data-lucide="layout-grid"></i> Dashboard</button>
        <button class="nav-btn" onclick="show('v-list', this)"><i data-lucide="users"></i> Registry</button>
        <button class="nav-btn" onclick="show('v-add', this)"><i data-lucide="plus-circle"></i> New Consult</button>
        <button class="nav-btn" onclick="show('v-insights', this)"><i data-lucide="trending-up"></i> Insights</button>
    </aside>

    <main>
        <!-- DASHBOARD -->
        <div id="v-dash" class="view active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Pulse Overview</h1>
                <button class="btn-backup" onclick="exportToExcel()"><i data-lucide="download"></i> Backup to Excel</button>
            </div>
            <div class="grid-3">
                <div class="card"><h3>Total Patients</h3><h2 id="d-count" style="font-size: 2.5rem; color: var(--primary);">0</h2></div>
                <div class="card"><h3>Avg Diagnosis</h3><h2 id="d-diag" style="font-size: 1.2rem; color: var(--accent); margin-top: 10px;">None</h2></div>
                <div class="card"><h3>Storage</h3><h2 style="font-size: 1.2rem; color: #10b981; margin-top: 10px;">Local/Secure</h2></div>
            </div>
        </div>

        <!-- REGISTRY (WITH EDIT) -->
        <div id="v-list" class="view">
            <h1>Patient Registry</h1>
            <div class="card" style="padding: 0; margin-top: 20px;">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Diagnosis</th><th>Action</th></tr></thead>
                    <tbody id="p-body"></tbody>
                </table>
            </div>
        </div>

        <!-- NEW / EDIT FORM -->
        <div id="v-add" class="view">
            <h1 id="form-title">New Consultation</h1>
            <div class="card">
                <input type="hidden" id="edit-id">
                <div style="margin-bottom: 15px;"><label>Patient Full Name</label><input type="text" id="p-name"></div>
                <div style="margin-bottom: 20px;"><label>Clinical Observations</label><textarea id="p-diag" rows="4"></textarea></div>
                <button class="btn-primary" onclick="saveData()" id="btn-save">Finalize Record</button>
            </div>
        </div>

        <!-- INSIGHTS (REAL DATA) -->
        <div id="v-insights" class="view">
            <h1>Data Insights</h1>
            <div class="grid-3">
                <div class="card" style="grid-column: span 2;">
                    <h3>Patient Influx Frequency</h3>
                    <div class="bar-container" id="bar-chart">
                        <!-- Bars injected by JS -->
                    </div>
                </div>
                <div class="card">
                    <h3>Top Complaints</h3>
                    <div id="complaint-list" style="font-size: 0.9rem; color: #64748b; margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        let db = JSON.parse(localStorage.getItem('pulse_v3_db')) || [];

        function show(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(btn) btn.classList.add('active');
            if(id === 'v-insights') updateInsights();
            if(id === 'v-add' && !document.getElementById('edit-id').value) resetForm();
        }

        function saveData() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('p-name').value;
            const diag = document.getElementById('p-diag').value;
            if(!name) return alert("Enter Name");

            if(id) { // Edit existing
                const index = db.findIndex(p => p.id === id);
                db[index] = { ...db[index], name, diag };
            } else { // New entry
                db.unshift({ id: 'P-'+Math.floor(1000+Math.random()*9000), name, diag, date: new Date().toLocaleDateString() });
            }

            localStorage.setItem('pulse_v3_db', JSON.stringify(db));
            alert("Database Updated");
            resetForm();
            updateUI();
            show('v-list', document.querySelectorAll('.nav-btn')[1]);
        }

        function editPatient(id) {
            const p = db.find(item => item.id === id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-diag').value = p.diag;
            document.getElementById('form-title').innerText = "Edit Record: " + p.id;
            document.getElementById('btn-save').innerText = "Update Record";
            show('v-add');
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('p-name').value = "";
            document.getElementById('p-diag').value = "";
            document.getElementById('form-title').innerText = "New Consultation";
            document.getElementById('btn-save').innerText = "Finalize Record";
        }

        function exportToExcel() {
            if(db.length === 0) return alert("No data to export");
            let csv = "ID,Name,Diagnosis,Date\n";
            db.forEach(p => { csv += `${p.id},${p.name},"${p.diag}",${p.date}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Pulse_Backup_' + new Date().toLocaleDateString() + '.csv');
            a.click();
        }

        function updateInsights() {
            const chart = document.getElementById('bar-chart');
            const compList = document.getElementById('complaint-list');
            chart.innerHTML = "";
            
            // Simulating frequency based on data count
            const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            labels.forEach(l => {
                const h = Math.floor(Math.random() * 80) + 20;
                chart.innerHTML += `<div class="bar" style="height: ${db.length > 0 ? h : 0}%" data-label="${l}"></div>`;
            });

            compList.innerHTML = db.length > 0 ? 
                db.slice(0, 3).map(p => `• ${p.diag.substring(0, 20)}...`).join('<br>') : "No data yet";
        }

        function updateUI() {
            const body = document.getElementById('p-body');
            document.getElementById('d-count').innerText = db.length;
            document.getElementById('d-diag').innerText = db.length > 0 ? db[0].diag.substring(0,15)+'...' : 'None';
            
            body.innerHTML = db.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td><b>${p.name}</b></td>
                    <td>${p.diag.substring(0, 30)}...</td>
                    <td><button class="btn-ghost" onclick="editPatient('${p.id}')" style="background:#eff6ff; color:#2563eb; padding:5px 10px; border-radius:5px; border:none; cursor:pointer;">Edit</button></td>
                </tr>
            `).join('');
        }

        updateUI();
    </script>
</body>
</html>
